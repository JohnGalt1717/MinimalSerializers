name: release
on:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x
      - name: version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - run: dotnet tool restore
      - run: dotnet restore MinimalSerializers.slnx
      - run: dotnet build MinimalSerializers.slnx -c Release --no-restore -p:Version=${{ steps.ver.outputs.version }}
      - run: dotnet test tests/MinimalSerializers.Json.Tests/MinimalSerializers.Json.Tests.csproj -c Release --no-build
      - run: dotnet test tests/MinimalSerializers.Json.Package.Tests/MinimalSerializers.Json.Package.Tests.csproj -c Release --no-build
      # Pack after solution build so Tasks/bin/Release/net8.0 assets already exist.
      - run: dotnet pack src/MinimalSerializers.Json/MinimalSerializers.Json.csproj -c Release -o artifacts/packages --no-build -p:Version=${{ steps.ver.outputs.version }} -p:PackageVersion=${{ steps.ver.outputs.version }}
      - name: push nuget
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "NUGET_API_KEY secret is not set on this repository."
            exit 1
          fi
          dotnet nuget push artifacts/packages/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/packages/*
          body_path: RELEASE_NOTES.md
