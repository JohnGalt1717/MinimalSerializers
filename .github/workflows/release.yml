name: release
on:
  push:
    tags: ['v*']

# NuGet Trusted Publishing (OIDC) — no long-lived NUGET_API_KEY secret required.
# On nuget.org, the trusted policy Workflow File must be exactly: release.yml
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # required for NuGet/login OIDC → temporary API key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x

      - name: version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - run: dotnet tool restore
      - run: dotnet restore MinimalSerializers.slnx
      - run: dotnet build MinimalSerializers.slnx -c Release --no-restore -p:Version=${{ steps.ver.outputs.version }}
      - run: dotnet test tests/MinimalSerializers.Json.Tests/MinimalSerializers.Json.Tests.csproj -c Release --no-build
      - run: dotnet test tests/MinimalSerializers.Json.Package.Tests/MinimalSerializers.Json.Package.Tests.csproj -c Release --no-build

      # Pack after solution build so Tasks/bin/Release/net8.0 assets already exist.
      - name: pack
        run: |
          dotnet pack src/MinimalSerializers.Json/MinimalSerializers.Json.csproj \
            -c Release \
            -o artifacts/packages \
            --no-build \
            -p:Version="${{ steps.ver.outputs.version }}" \
            -p:PackageVersion="${{ steps.ver.outputs.version }}"

      # Exchange GitHub OIDC token for a short-lived nuget.org API key.
      # user = nuget.org profile username (NOT email). Set repo variable NUGET_USER.
      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: NuGet push
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push artifacts/packages/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/packages/*
          body_path: RELEASE_NOTES.md
